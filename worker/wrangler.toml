name = "family-tree-ask-worker"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true
preview_urls = false

# Daily birthday-notification job (see src/index.js's `scheduled` export).
# 3:30 AM UTC = 9:00 AM IST — Cloudflare Cron Triggers are UTC-only, so this
# has to be recomputed by hand if the target local time ever changes.
[triggers]
crons = ["30 3 * * *"]

# GROQ_API_KEY is set via `wrangler secret put GROQ_API_KEY` — never stored in
# this file or anywhere else in the repo.
#
# GCP_SERVICE_ACCOUNT_JSON: the full JSON key of a DEDICATED, read-only
# (roles/datastore.viewer only — see SKILLS.md) Google service account, piped
# in whole via `wrangler secret put GCP_SERVICE_ACCOUNT_JSON < key.json` (not
# typed interactively, and not just the extracted private key — piping the
# whole file preserves the private key's real newlines, which is easy to
# mangle otherwise). Used only by the scheduled birthday job to read Firestore
# with no signed-in user present.
#
# BREVO_API_KEY: set via `wrangler secret put BREVO_API_KEY` — the
# transactional email API the birthday job sends through (see email.js;
# Resend was tried first but hard-rejects any recipient besides the account
# owner without a verified domain — Brevo doesn't have that restriction).
